name: Stage one acceptance

on:
  push:
  pull_request:

jobs:
  linux-clean-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native Tauri and WebDriver dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libdbus-1-dev pkg-config patchelf
          webkit2gtk-driver xvfb gocryptfs libsecret-tools

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix apps/desktop/e2e

      - name: Install Tauri WebDriver bridge
        run: cargo install tauri-driver --locked

      - name: Core tests
        run: cargo test -p pinky-core --locked

      - name: Native Tauri end-to-end test
        run: npm run test:e2e --prefix apps/desktop

      - name: Build Debian and AppImage bundles
        run: npm run bundle:linux --prefix apps/desktop

      - name: Inspect clean-machine bundles
        run: npm run verify:bundle --prefix apps/desktop

      - name: Install and launch Debian package in a clean Debian 13 container
        run: npm run test:clean-install --prefix apps/desktop
